<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="喵喵生活 · 记账，记录每日收支、预算与统计">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>喵喵生活 · 记账</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6366f1;--primaryLight:#818cf8;--primaryBg:#eef2ff;
  --bg:#f1f5f9;--card:#ffffff;--text:#1f2937;--textSecondary:#64748b;
  --textMuted:#94a3b8;--danger:#fb7185;--dangerBg:#fff1f4;
  --success:#10b981;--successBg:#eafaf3;--border:#e8edf4;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overflow:hidden;height:-webkit-fill-available;height:100dvh;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;overflow:hidden}
#content{flex:1;overflow-y:scroll;overflow-x:hidden;padding:16px 16px 0;overflow-anchor:none;scroll-behavior:auto}
.screen{display:none;padding-bottom:24px}
.screen.active{display:block}
.tab-bar{display:flex;background:var(--card);border-top:1px solid var(--border);padding:6px 0 max(env(safe-area-inset-bottom,6px),20px);z-index:100;box-shadow:0 -2px 12px rgba(99,102,241,.10)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 0;color:var(--textMuted);cursor:pointer;transition:color .15s;font-size:11px}
.tab-item.active{color:#fff}.tab-item.active .tab-inner{background:var(--primary);border-radius:12px;padding:4px 16px}.tab-icon{font-size:22px;margin-bottom:2px}.tab-inner{display:flex;flex-direction:column;align-items:center}
.tab-item.special .tab-icon{width:56px;height:56px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;margin-top:-14px;box-shadow:0 4px 12px rgba(99,102,241,.32);margin-bottom:2px}
.card{background:var(--card);border-radius:16px;padding:10px;margin-bottom:8px;box-shadow:0 2px 12px rgba(99,102,241,.10)}
.row{display:flex;justify-content:space-between;align-items:center}
.summary-row{display:flex;align-items:center;margin-top:8px}
.summary-item{flex:1;text-align:center}
.summary-label{font-size:13px;color:var(--textMuted);margin-bottom:2px}
.summary-amount{font-size:22px;font-weight:400}
.summary-divider{width:1px;height:40px;background:var(--border)}
.bar-bg{width:100%;height:8px;border-radius:4px;background:#eef2ff;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--primary);transition:width .3s}
.bar-over{background:var(--danger)}
.btn{background:var(--primary);color:#fff;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:500;width:100%;cursor:pointer;box-shadow:0 4px 10px rgba(99,102,241,.25)}
.btn:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed}
.btn-text{background:none;border:none;color:var(--primary);font-size:15px;cursor:pointer}
.flat-btn{background:none;border:none;padding:8px 12px;border-radius:12px;cursor:pointer;font-size:14px;color:var(--primary);transition:background .15s}
.flat-btn:hover{background:var(--primaryBg)}.flat-btn.danger{color:var(--danger)}.flat-btn.danger:hover{background:var(--dangerBg)}
.header-section{display:flex;justify-content:space-between;align-items:flex-start;padding:0 4px 8px}
.date-block{cursor:pointer}.date-day{font-size:30px;font-weight:400;margin-right:10px}.date-weekday{font-size:14px;color:var(--textSecondary)}
.date-num{display:inline-block;min-width:2ch;text-align:center}.date-num-month{text-align:right}.date-year{display:inline-block;min-width:4.5ch;text-align:center}
.eye-btn{width:44px;height:44px;border-radius:22px;background:var(--card);border:none;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 6px rgba(30,41,59,.06)}
.action-grid{display:flex;justify-content:space-around}.action-item{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.action-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:6px}
.bg1{background:var(--primaryBg)}.bg2{background:#EBF5FF}.bg3{background:var(--successBg)}.bg4{background:var(--dangerBg)}
.action-label{font-size:13px;color:var(--textSecondary)}
.empty-state{text-align:center;padding:60px 0}
.bill-item{background:var(--card);border-radius:16px;padding:8px;margin-bottom:4px;cursor:pointer;box-shadow:0 1px 8px rgba(99,102,241,.08)}
.bill-row{display:flex;justify-content:space-between;align-items:center}
.bill-icon-name{display:flex;align-items:center;gap:0;min-width:0}.bill-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}.bill-cat{font-size:16px;font-weight:400;width:60px;text-align:right;flex-shrink:0}.bill-note{font-size:13px;color:var(--textMuted);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill-amount{font-size:18px;font-weight:400}

.month-header{display:flex;justify-content:center;align-items:center;gap:20px;padding:0 8px;margin-bottom:12px}
.month-arrow{font-size:32px;cursor:pointer;padding:0 8px;-webkit-user-select:none;user-select:none;line-height:1}
.month-title{font-size:20px;font-weight:400;cursor:pointer}
.weekday-row{display:flex;margin-bottom:6px}.weekday-text{flex:1;text-align:center;font-size:13px;color:var(--textMuted);font-weight:400}
.day-grid{display:flex;flex-wrap:wrap}
.day-cell{width:14.28%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:20px;position:relative;font-size:15px}
.day-cell.selected{background:var(--primary);color:#fff;font-weight:400}.day-cell.today{color:var(--primary);font-weight:400}
.day-cell.selected.today{color:#fff}.day-dot{width:5px;height:5px;border-radius:50%;background:var(--primary);margin-top:2px}
.day-cell.selected .day-dot{background:#fff}
.cal-card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 2px 12px rgba(99,102,241,.10);contain:layout style}
.cal-summary{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--card);border-radius:16px;margin-top:8px;box-shadow:0 2px 12px rgba(99,102,241,.10)}
.cal-summary-left{font-size:15px;color:var(--success)}.cal-summary-right{font-size:15px;color:var(--danger)}
.today-btn{display:block;margin:0 auto 12px;background:var(--primaryBg);border:none;padding:6px 16px;border-radius:16px;color:var(--primary);font-size:14px;font-weight:400;cursor:pointer}
.section-header{display:flex;justify-content:space-between;align-items:center;padding:0 8px;margin-bottom:8px}.section-title{font-size:18px;font-weight:400}
#calDateLabel{display:inline-block;min-width:64px}#calBillCount{display:inline-block;min-width:4.5em;text-align:right}
#calBillListWrapper{min-height:120px}

.switch-wrap{display:flex;justify-content:center;padding:4px 0}.switch-track{display:flex;width:220px;height:44px;border-radius:22px;background:#e8edf4;position:relative}
.switch-bg{position:absolute;width:50%;height:40px;top:2px;border-radius:20px;background:#fff;box-shadow:0 1px 4px rgba(30,41,59,.10);transition:left .25s cubic-bezier(.4,0,.2,1)}
.switch-bg.income{left:50%}
.switch-option{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1;font-size:16px;color:var(--textSecondary);-webkit-user-select:none;user-select:none;transition:color .15s}
.switch-option.active{color:var(--text);font-weight:500}
.amount-section{display:flex;align-items:baseline;justify-content:center;padding:12px 0;border-bottom:1px dashed var(--border);margin-bottom:10px}
.amount-currency{font-size:26px;font-weight:300;margin-right:6px}
.amount-input{font-size:44px;font-weight:400;width:180px;text-align:center;border:none;background:transparent;color:var(--text);outline:none}.amount-input::placeholder{color:#cbd5e1}
.cat-label{font-size:14px;color:var(--textSecondary);margin-bottom:4px;padding-left:4px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px;max-height:240px;overflow-y:auto;padding-right:2px}
.cat-item{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:12px;cursor:pointer;transition:background .15s}
.cat-icon-wrap{width:40px;height:40px;border-radius:12px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:4px;flex-shrink:0}.cat-item.selected .cat-icon-wrap{background:#e0e7ff}
.cat-name{font-size:12px;color:var(--textSecondary);text-align:center;line-height:1.3;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.cat-item.selected .cat-name{color:#fff;font-weight:400}.cat-item .cat-inner{display:flex;flex-direction:column;align-items:center;padding:4px 12px;border-radius:12px}.cat-item.selected .cat-inner{background:var(--primary)}
.detail-card{background:var(--card);border-radius:16px;overflow:hidden}
.form-row{display:flex;justify-content:space-between;align-items:center;padding:10px}
.form-divider{height:1px;background:var(--border);margin-left:18px}
.form-label{font-size:16px}.form-value{font-size:16px;color:var(--textSecondary)}.note-input{flex:1;font-size:16px;border:none;outline:none;text-align:right;color:var(--text);margin-left:12px}.note-input::placeholder{color:var(--textMuted)}
.save-btn-wrap{margin-top:12px;padding:0 8px}

.profile-card{text-align:center;padding:18px}.avatar{width:60px;height:60px;border-radius:50%;background:#e0e7ff;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:30px}
.username{font-size:18px;font-weight:400;margin-top:10px;cursor:pointer}
.stats-row{display:flex;align-items:center;margin-top:12px}.stat-item{flex:1;text-align:center}
.stat-value{font-size:22px;font-weight:400}.stat-label{font-size:13px;color:var(--textSecondary);margin-top:2px}.stat-divider{width:1px;height:40px;background:var(--border)}
.days-text{font-size:14px;color:var(--textSecondary);margin-top:10px}
.menu-row{display:flex;justify-content:space-between;align-items:center;padding:12px;cursor:pointer}.menu-row:hover{background:var(--primaryBg)}
.menu-item{display:flex;align-items:center;padding:12px;cursor:pointer;gap:12px}.menu-item:hover{background:var(--primaryBg)}
.menu-icon{font-size:18px}.menu-label{font-size:15px}
.menu-divider{height:1px;background:var(--border);margin-left:16px}.menu-divider2{height:1px;background:var(--border);margin-left:48px}
.budget-input{font-size:20px;font-weight:400;width:120px;text-align:right;border:none;outline:none;color:var(--text);background:transparent}.budget-input::placeholder{color:var(--textMuted)}
.chart-title{font-size:17px;font-weight:400;margin-bottom:4px}
.donut-wrap{display:flex;justify-content:center;margin:12px 0 6px}.donut-svg{width:100%;max-width:460px;height:auto}
.cat-total{margin-top:8px;padding-top:10px;border-top:1px solid var(--border);font-size:13px;color:var(--textMuted);text-align:right}
.legend-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.legend-left{display:flex;align-items:center;gap:4px;min-width:0}.legend-icon{width:20px;text-align:center;flex-shrink:0;font-size:14px}
.legend-name{font-size:14px;min-width:3em;text-align:left;flex-shrink:0}.legend-right{display:flex;flex-direction:column;justify-content:center;align-items:flex-end}.legend-amount{font-size:15px;font-weight:400;line-height:1.2}.legend-pct{font-size:12px;color:var(--textMuted);line-height:1.2}
.version-footer{text-align:center;padding:24px 0 12px;font-size:13px;color:var(--textMuted)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(30,41,59,.35);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal-sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px 24px 30px;max-height:70vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:500;text-align:center;margin-bottom:16px}
.modal-input{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:16px;outline:none;margin-bottom:16px}.modal-input:focus{border-color:var(--primary)}
.modal-buttons{display:flex;gap:12px}.modal-btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px;cursor:pointer;font-weight:500}.modal-btn.cancel{background:#e8edf4;color:var(--textSecondary)}.modal-btn.confirm{background:var(--primary);color:#fff}.modal-btn.danger-confirm{background:var(--danger);color:#fff}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Date inputs - native overlay for iOS/Android compatibility */
.date-input-native{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;z-index:3;cursor:pointer}
.date-wrap{position:relative;display:inline-block;cursor:pointer}
.form-date-input{border:none;background:transparent;font-size:16px;color:var(--textSecondary);outline:none;font-family:inherit;text-align:right;padding:0;width:130px;position:relative}
.form-date-input::-webkit-calendar-picker-indicator{opacity:0.35;cursor:pointer}
.today-home-btn{background:var(--text);border:none;padding:5px 14px;border-radius:16px;color:#fff;font-size:13px;font-weight:400;cursor:pointer;white-space:nowrap;flex-shrink:0}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,41,59,.90);color:#fff;padding:12px 24px;border-radius:12px;font-size:15px;z-index:300;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}

/* Checkbox */
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:15px;margin:8px 0;cursor:pointer}
.checkbox-label input{width:18px;height:18px;accent-color:var(--primary)}

/* Export/Import */
.export-btns{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.export-btn{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:16px;cursor:pointer;text-align:left;transition:background .15s}.export-btn:hover{background:var(--primaryBg)}
.import-tabs{display:flex;gap:0;margin-bottom:16px;border-radius:10px;overflow:hidden;background:#e8edf4}
.import-tab{flex:1;padding:10px;border:none;background:transparent;font-size:15px;cursor:pointer;color:var(--textSecondary);text-align:center;transition:all .15s}
.import-tab.active{background:var(--primary);color:#fff;font-weight:500}
.file-upload-area{border:2px dashed var(--border);border-radius:16px;padding:32px;text-align:center;cursor:pointer;margin-bottom:16px;transition:border-color .2s,background .2s}
.back-to-compare{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:150;background:var(--primaryBg);color:var(--primary);text-decoration:none;font-size:13px;font-weight:500;padding:7px 13px;border-radius:16px;box-shadow:0 2px 8px rgba(99,102,241,.20)}

/* ============================================================
   柔和界面风覆盖层 — 大圆角 / 彩色柔光 / 低饱和 / 300-500ms
   ============================================================ */
:root{
  --primary:#6366f1;--primaryLight:#818cf8;--primaryBg:#eef2ff;
  --bg:#f1f5f9;--card:#ffffff;--text:#1f2937;--textSecondary:#64748b;
  --textMuted:#94a3b8;--danger:#fb7185;--dangerBg:#fff1f4;
  --success:#10b981;--successBg:#eafaf3;--border:#e8edf4;
  --shadow-card:0 12px 32px rgba(148,163,184,.25);
  --shadow-hover:0 24px 48px rgba(99,102,241,.20);
  --shadow-btn:0 10px 24px rgba(99,102,241,.25);
  --shadow-press:inset 0 4px 10px rgba(67,56,202,.28);
}
*{scrollbar-width:none}
::-webkit-scrollbar{display:none}
body{
  background:radial-gradient(1100px 620px at 50% -12%,rgba(99,102,241,.09),transparent 62%),var(--bg);
  font-size:14px;line-height:1.65;
}
#content{padding:20px 16px 0}
.screen.active{animation:softFade .45s cubic-bezier(.22,1,.36,1)}
@keyframes softFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 卡片：24px 圆角 + 石板灰柔光，hover 上浮并转靛蓝柔光 */
.card,.cal-card,.cal-summary,.detail-card,.profile-card,.bill-item{
  border-radius:24px;padding:16px;box-shadow:var(--shadow-card);border:none;
  transition:transform .5s ease-in-out,box-shadow .5s ease-in-out;
}
.card:hover,.bill-item:hover,.cal-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-hover)}
.bill-item{padding:12px 14px;margin-bottom:10px}
.detail-card{padding:8px}
.profile-card{padding:22px}

/* 按钮：16px 圆角 + 靛蓝柔光 + 上浮/内凹 */
.btn,.modal-btn,.today-home-btn{
  border-radius:16px;font-weight:600;transition:transform .3s ease-in-out,box-shadow .3s ease-in-out;
  box-shadow:var(--shadow-btn);
}
.btn:hover,.modal-btn.confirm:hover,.today-home-btn:hover{transform:translateY(-4px);box-shadow:0 18px 32px rgba(99,102,241,.35)}
.btn:active,.modal-btn:active,.today-home-btn:active{transform:translateY(0) scale(.96);box-shadow:var(--shadow-press)}
.btn:disabled{background:#cbd5e1;box-shadow:none;transform:none}
.btn-text,.flat-btn{font-weight:600}
.flat-btn,.today-btn,.modal-btn.cancel,.export-btn{border-radius:16px;transition:transform .3s ease-in-out,box-shadow .3s ease-in-out}
.flat-btn:hover,.today-btn:hover,.export-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-btn)}
.modal-btn.cancel{background:var(--bg);color:var(--textSecondary)}

/* 输入框：雾灰底 + 聚焦白底/4px 靛蓝环/柔光 */
.modal-input,.note-input,.budget-input,.form-date-input,.amount-input,.checkbox-label input{transition:box-shadow .3s ease-in-out,background .3s ease-in-out}
.modal-input{background:var(--bg);border:1px solid transparent;border-radius:16px}
.modal-input:focus{background:#fff;border-color:transparent;box-shadow:0 0 0 4px rgba(99,102,241,.20),0 10px 26px rgba(99,102,241,.14)}
.amount-input{font-weight:700;letter-spacing:-.01em}
.amount-currency{font-weight:600}

/* 圆形图标块 */
.eye-btn,.avatar,.cat-icon-wrap,.action-icon,.switch-bg{
  transition:transform .3s ease-in-out,box-shadow .3s ease-in-out,background .3s ease-in-out;
}
.eye-btn:hover,.action-icon:hover{transform:translateY(-3px)}
.action-icon{border-radius:16px}
.cat-icon-wrap{border-radius:14px}
.cat-item.selected .cat-icon-wrap{box-shadow:0 8px 18px rgba(99,102,241,.22)}
.cat-item .cat-inner{border-radius:16px;transition:box-shadow .3s}
.cat-item.selected .cat-inner{box-shadow:var(--shadow-btn)}
.avatar{box-shadow:0 10px 24px rgba(99,102,241,.22)}

/* 底部导航：毛玻璃 + 柔光，选中态胶囊 */
.tab-bar{background:rgba(255,255,255,.90);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:none;box-shadow:0 -8px 30px rgba(99,102,241,.10);padding-top:10px}
.tab-item.active .tab-inner{border-radius:16px;box-shadow:var(--shadow-btn)}
.tab-item.special .tab-icon{box-shadow:0 10px 24px rgba(99,102,241,.35);transition:transform .3s ease-in-out,box-shadow .3s ease-in-out}
.tab-item.special .tab-icon:hover{transform:translateY(-4px);box-shadow:0 18px 32px rgba(99,102,241,.40)}

/* 日历 / 进度 / 分隔 */
.day-cell{border-radius:16px;transition:background .3s,transform .3s}
.day-cell:hover{background:var(--primaryBg)}
.day-cell.selected:hover{background:var(--primary)}
.bar-bg,.bar-fill{border-radius:999px}
.summary-divider,.stat-divider{background:var(--border)}
.form-divider,.menu-divider,.menu-divider2,.legend-row,.cat-total,.amount-section{border-color:var(--border)}

/* 弹层：24px 圆角 + 柔光 + 400ms 滑入 */
.modal-overlay{background:rgba(30,41,59,.32);backdrop-filter:blur(4px)}
.modal-sheet{
  border-radius:24px 24px 0 0;padding:24px 24px 32px;max-width:520px;
  box-shadow:0 -16px 48px rgba(99,102,241,.18);
  animation:softSlide .4s cubic-bezier(.22,1,.36,1);
}
@keyframes softSlide{from{transform:translateY(100%);opacity:.6}to{transform:none;opacity:1}}
.modal-title{font-weight:600}

/* Toast / 返回按钮 / 导入导出 */
.toast{border-radius:999px;box-shadow:0 12px 32px rgba(30,41,59,.28);transition:opacity .3s,transform .3s}
.back-to-compare{
  background:#fff;border-radius:999px;padding:9px 16px;
  box-shadow:0 10px 24px rgba(99,102,241,.20);transition:transform .3s,box-shadow .3s;
}
.back-to-compare:hover{transform:translateY(-3px);box-shadow:var(--shadow-btn)}
.export-btn{border:1px solid transparent;background:var(--bg);border-radius:16px}
.import-tabs,.switch-track{background:var(--bg);border-radius:16px}
.switch-bg{border-radius:14px;box-shadow:0 6px 16px rgba(99,102,241,.22)}
.legend-dot{box-shadow:0 2px 6px rgba(30,41,59,.10)}

<body>
<div id="app">
  <a class="back-to-compare" href="index.html" title="返回比价">‹ 比价</a>
  <div id="content"></div>
  <div class="tab-bar" id="tabBar"></div>
</div>
<div id="modalContainer"></div>
<div class="toast" id="toast"></div>

<script>
// ========== DATA LAYER ==========
const STORAGE_KEYS = {bills:'xb_bills',budget:'xb_budget',username:'xb_username'};

function loadBills(){try{return JSON.parse(localStorage.getItem(STORAGE_KEYS.bills)||'[]')}catch{return[]}}
function saveBills(b){localStorage.setItem(STORAGE_KEYS.bills,JSON.stringify(b))}
function loadBudget(){return parseFloat(localStorage.getItem(STORAGE_KEYS.budget))||0}
function saveBudget(v){localStorage.setItem(STORAGE_KEYS.budget,String(v))}
function loadUsername(){return localStorage.getItem(STORAGE_KEYS.username)||'喵喵生活'}
function saveUsername(n){localStorage.setItem(STORAGE_KEYS.username,n)}

// ========== CONSTANTS ==========
const EXPENSE_CATS=[
  {id:'shopping',name:'购物',icon:'🛍️'},{id:'food',name:'餐饮',icon:'🍽️'},{id:'transport',name:'交通',icon:'🚗'},
  {id:'entertainment',name:'娱乐',icon:'🎮'},{id:'housing',name:'住房',icon:'🏠'},{id:'medical',name:'医疗',icon:'💊'},
  {id:'education',name:'教育',icon:'📚'},{id:'communication',name:'通讯',icon:'📱'},{id:'daily',name:'日用',icon:'🧴'},
  {id:'clothing',name:'服饰',icon:'👗'},{id:'beauty',name:'美容',icon:'💄'},{id:'sports',name:'运动',icon:'⚽'},
  {id:'pet',name:'宠物',icon:'🐾'},{id:'gift',name:'礼物',icon:'🎁'},{id:'travel',name:'旅行',icon:'✈️'},
  {id:'digital',name:'数码',icon:'💻'},{id:'snacks',name:'零食',icon:'🍿'},{id:'drinks',name:'饮品',icon:'🥤'},
  {id:'fruit',name:'水果',icon:'🍎'},{id:'grocery',name:'蔬菜',icon:'🥬'},{id:'takeout',name:'外卖',icon:'🥡'},
  {id:'express',name:'快递',icon:'📦'},{id:'other',name:'其他',icon:'💰'}
];
const INCOME_CATS=[
  {id:'salary',name:'工资',icon:'💼'},{id:'parttime',name:'兼职',icon:'⏰'},{id:'redpacket',name:'红包',icon:'🧧'},
  {id:'bonus',name:'奖金',icon:'🏆'},{id:'investment',name:'理财',icon:'📈'},{id:'refund',name:'退款',icon:'💵'},
  {id:'reimburse',name:'报销',icon:'📋'},{id:'other_income',name:'其他',icon:'✨'}
];
const ALL_CATS=[...EXPENSE_CATS,...INCOME_CATS];
const PIE_COLORS=['#fb7185','#60a5fa','#10b981','#f59e0b','#a78bfa','#2dd4bf','#ec4899','#fbbf24','#334155','#84cc16','#a1887f','#22d3ee','#a855f7','#f59e0b','#6366f1','#e11d48','#a3a35b','#64748b','#db2777','#0d9488'];
const INC_COLORS=['#10b981','#60a5fa','#f59e0b','#a78bfa','#2dd4bf','#ec4899'];

function getCat(id){return ALL_CATS.find(c=>c.id===id)||{id:'other',name:'其他',icon:'💰'}}
function fmtDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function fmtMoney(n){return Number(n).toFixed(2)}
function monthRange(y,m){const s=new Date(y,m-1,1),e=new Date(y,m,0,23,59,59);return{start:s.getTime(),end:e.getTime()}}
function genId(){return'b_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function dateLabel(s){
  const t=fmtDate(new Date()),y=new Date(Date.now()-86400000);const yd=fmtDate(y);
  if(s===t)return'今天';if(s===yd)return'昨天';
  const d=new Date(s);return`${d.getMonth()+1}月${d.getDate()}日`;
}
function weekday(s){const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];return wd[new Date(s).getDay()]}
function drawDonutSVG(list,total,colors){
  const cx=230,cy=140,r=120,ir=65;
  let angle=0,paths='',texts='';
  const leftLabels=[],rightLabels=[];
  list.forEach((item,i)=>{
    const pct=item.amount/total;
    const sweep=pct*2*Math.PI;
    const isFull=sweep>=2*Math.PI-0.0001;
    if(isFull){
      const drawArc=(a1,a2)=>{
        const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
        const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
        const ix1=cx+ir*Math.cos(a1),iy1=cy+ir*Math.sin(a1);
        const ix2=cx+ir*Math.cos(a2),iy2=cy+ir*Math.sin(a2);
        return`<path d="M${ix1.toFixed(2)} ${iy1.toFixed(2)} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 1 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${ix2.toFixed(2)} ${iy2.toFixed(2)} A${ir} ${ir} 0 1 0 ${ix1.toFixed(2)} ${iy1.toFixed(2)} Z" fill="${colors[i%colors.length]}"/>`;
      };
      const a0=angle-Math.PI/2,am=angle+Math.PI-Math.PI/2,ae=angle+2*Math.PI-Math.PI/2;
      paths+=drawArc(a0,am)+drawArc(am,ae);
      angle+=2*Math.PI;
      texts+=`<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="14" font-weight="500">${(pct*100).toFixed(2)}%</text>`;
      return;
    }
    const sa=angle-Math.PI/2,ea=angle+sweep-Math.PI/2;
    const midAngle=sa+(ea-sa)/2;
    angle+=sweep;
    const la=ea-sa>Math.PI?1:0;
    const x1=cx+r*Math.cos(sa),y1=cy+r*Math.sin(sa);
    const x2=cx+r*Math.cos(ea),y2=cy+r*Math.sin(ea);
    const ix1=cx+ir*Math.cos(sa),iy1=cy+ir*Math.sin(sa);
    const ix2=cx+ir*Math.cos(ea),iy2=cy+ir*Math.sin(ea);
    paths+=`<path d="M${ix1.toFixed(2)} ${iy1.toFixed(2)} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${la} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${ix2.toFixed(2)} ${iy2.toFixed(2)} A${ir} ${ir} 0 ${la} 0 ${ix1.toFixed(2)} ${iy1.toFixed(2)} Z" fill="${colors[i%colors.length]}"/>`;
    if(pct>=0.0001){
      if(pct>=0.08){
        const mr=(r+ir)/2;
        const tx=cx+mr*Math.cos(midAngle),ty=cy+mr*Math.sin(midAngle);
        texts+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="12" font-weight="500">${(pct*100).toFixed(2)}%</text>`;
      } else {
        const mr=(r+ir)/2;
        const innerX=cx+mr*Math.cos(midAngle),innerY=cy+mr*Math.sin(midAngle);
        const outerX=cx+(r+10)*Math.cos(midAngle),outerY=cy+(r+10)*Math.sin(midAngle);
        const dir=Math.cos(midAngle)>0?1:-1;
        (dir>0?rightLabels:leftLabels).push({innerX,innerY,outerX,outerY,outerY:outerY,midAngle,dir,pct,item,color:colors[i%colors.length]});
      }
    }
  });
  function renderLabelGroup(labels,labelX,textAnchor,svgH){
    labels.sort((a,b)=>a.outerY-b.outerY);
    const minGap=20;
    for(let i=1;i<labels.length;i++){
      if(labels[i].outerY-labels[i-1].outerY<minGap) labels[i].outerY=labels[i-1].outerY+minGap;
    }
    labels.forEach(l=>{
      const origOY=l.outerY;
      l.outerY=Math.max(12,Math.min(svgH-12,l.outerY));
      const dir=textAnchor==='start'?1:-1;
      const actualAnchor=textAnchor==='start'?'end':'start';
      const midX=((l.outerX+labelX)/2).toFixed(1);
      const textAt=(labelX-dir*5).toFixed(1);
      texts+=`<polyline points="${l.innerX.toFixed(1)},${l.innerY.toFixed(1)} ${l.outerX.toFixed(1)},${origOY.toFixed(1)} ${midX},${origOY.toFixed(1)} ${labelX.toFixed(1)},${l.outerY.toFixed(1)}" fill="none" stroke="${l.color}" stroke-width="1.2"/>`;
      texts+=`<text x="${textAt}" y="${l.outerY.toFixed(1)}" text-anchor="${actualAnchor}" dominant-baseline="central" fill="${l.color}" font-size="16">${l.item.name} ${(l.pct*100).toFixed(2)}%</text>`;
    });
  }
  const svgH=280;
  const leftLabelX=40,rightLabelX=420;
  renderLabelGroup(leftLabels,leftLabelX,'start',svgH);
  renderLabelGroup(rightLabels,rightLabelX,'end',svgH);
  return `<svg viewBox="-80 0 620 ${svgH}" class="donut-svg">${paths}${texts}</svg>`;
}

// ========== GLOBAL STATE ==========
let activeTab='home',showAmount=true,editingBillId='',selectedHomeDate=fmtDate(new Date());

// ========== HELPERS ==========
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),1800)}
function $(sel){return document.querySelector(sel)}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ========== MODAL SYSTEM ==========
function showModal(html){const c=document.getElementById('modalContainer');c.innerHTML=`<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">${html}</div></div>`}
function closeModal(){document.getElementById('modalContainer').innerHTML=''}
let _dateActive=false;
document.getElementById('modalContainer').addEventListener('click',e=>{if(e.target.id==='modalOverlay'&&!_dateActive)closeModal()});

function showEditModal(billId){
  const bills=loadBills();
  const bill=bills.find(b=>b.id===billId);
  if(!bill)return;
  let emType=bill.type;
  let emSelectedCat=bill.categoryId;

  function emCatHTML(type){
    const cats=type==='income'?INCOME_CATS:EXPENSE_CATS;
    return cats.map(c=>`<div class="cat-item${c.id===emSelectedCat?' selected':''}" data-cid="${c.id}"><div class="cat-inner"><div class="cat-icon-wrap">${c.icon}</div><div class="cat-name">${c.name}</div></div></div>`).join('');
  }

  function emBindCatItems(){
    document.querySelectorAll('#emCatGrid .cat-item').forEach(el=>el.addEventListener('click',()=>{
      document.querySelectorAll('#emCatGrid .cat-item').forEach(e=>e.classList.remove('selected'));
      el.classList.add('selected');emSelectedCat=el.dataset.cid;
    }));
  }

  function emUpdateSwitchUI(){
    document.getElementById('emSwitchBg').className='switch-bg'+(emType==='income'?' income':'');
    document.getElementById('emSwitchExpense').className='switch-option'+(emType==='expense'?' active':'');
    document.getElementById('emSwitchIncome').className='switch-option'+(emType==='income'?' active':'');
  }

  const html=`<div class="modal-overlay" id="modalOverlay" style="display:flex;align-items:flex-end">
    <div class="modal-sheet" style="max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding-bottom:max(env(safe-area-inset-bottom,6px),20px)">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px">
        <span style="font-size:18px;font-weight:500">编辑账单</span>
        <span style="font-size:24px;cursor:pointer;padding:4px 8px" id="emClose">✕</span>
      </div>
      <div class="switch-wrap">
        <div class="switch-track">
          <div class="switch-bg${emType==='income'?' income':''}" id="emSwitchBg"></div>
          <div class="switch-option${emType==='expense'?' active':''}" id="emSwitchExpense">支出</div>
          <div class="switch-option${emType==='income'?' active':''}" id="emSwitchIncome">收入</div>
        </div>
      </div>
      <div class="amount-section"><span class="amount-currency">¥</span><input class="amount-input" id="emAmount" type="text" inputmode="decimal" placeholder="0.00" value="${bill.amount}"></div>
      <div class="cat-label">选择分类</div>
      <div class="cat-grid" id="emCatGrid">${emCatHTML(emType)}</div>
      <div class="detail-card">
        <div class="form-row"><span class="form-label">日期</span><span class="form-value date-wrap">${bill.date}<input type="date" class="date-input-native" id="emDate" value="${bill.date}"></span></div>
        <div class="form-divider"></div>
        <div class="form-row"><span class="form-label">备注</span><input class="note-input" id="emNote" placeholder="添加备注..." value="${escapeHtml(bill.note||'')}"></div>
      </div>
      <div class="save-btn-wrap"><button class="btn" id="emSave">保存修改</button></div>
      <button class="btn" style="margin-top:8px;background:var(--dangerBg);color:var(--danger);border:none;border-radius:14px;padding:14px;width:100%;font-size:16px;cursor:pointer;font-weight:500" id="emDelete">删除此账单</button>
    </div>
  </div>`;
  document.getElementById('modalContainer').innerHTML=html;

  /* iOS picker guard: prevent overlay tap from closing modal while date picker is active */
  const emOverlay=document.getElementById('modalOverlay');
  const emDateEl=document.getElementById('emDate');
  emDateEl.addEventListener('focus',()=>{_dateActive=true});
  emDateEl.addEventListener('change',()=>{_dateActive=true});
  emDateEl.addEventListener('blur',()=>{setTimeout(()=>{_dateActive=false},300)});
  emOverlay.addEventListener('click',function(e){if(_dateActive)e.stopImmediatePropagation()},true);

  document.getElementById('emClose').addEventListener('click',closeModal);

  document.getElementById('emSwitchExpense').addEventListener('click',()=>{
    if(emType==='expense')return;
    emType='expense';emSelectedCat='';
    emUpdateSwitchUI();
    document.getElementById('emCatGrid').innerHTML=emCatHTML(emType);
    emBindCatItems();
  });
  document.getElementById('emSwitchIncome').addEventListener('click',()=>{
    if(emType==='income')return;
    emType='income';emSelectedCat='';
    emUpdateSwitchUI();
    document.getElementById('emCatGrid').innerHTML=emCatHTML(emType);
    emBindCatItems();
  });
  emBindCatItems();

  const emAi=document.getElementById('emAmount');
  emAi.addEventListener('input',function(){
    let v=this.value.replace(/[^\d.]/g,'');
    const parts=v.split('.');if(parts.length>2)v=parts[0]+'.'+parts.slice(1).join('');
    if(parts.length===2&&parts[1].length>2)v=parts[0]+'.'+parts[1].slice(0,2);
    this.value=v;
  });
  setTimeout(()=>emAi.focus(),150);

  document.getElementById('emSave').addEventListener('click',()=>{
    const amount=parseFloat(emAi.value);
    if(!amount||amount<=0){toast('请输入金额');return}
    if(!emSelectedCat){toast('请选择分类');return}
    const note=document.getElementById('emNote').value.trim();
    const dateStr=document.getElementById('emDate').value;
    const d=new Date(dateStr);d.setHours(new Date().getHours(),new Date().getMinutes(),new Date().getSeconds());
    const bills=loadBills();
    const idx=bills.findIndex(b=>b.id===billId);
    if(idx===-1){toast('账单不存在');return}
    bills[idx]={...bills[idx],type:emType,categoryId:emSelectedCat,amount,note,date:dateStr,timestamp:d.getTime()};
    saveBills(bills);
    toast('修改成功');
    closeModal();renderContent();
  });

  document.getElementById('emDelete').addEventListener('click',()=>{
    if(!confirm('确定删除这笔账单吗？'))return;
    const bills=loadBills().filter(b=>b.id!==billId);
    saveBills(bills);
    toast('已删除');
    closeModal();renderContent();
  });
}

// ========== RENDER ==========
function renderContent(){
  const c=document.getElementById('content');
  if(activeTab==='home')c.innerHTML=renderHome();
  else if(activeTab==='calendar')c.innerHTML=renderCalendar();
  else if(activeTab==='add')c.innerHTML=renderAdd();
  else if(activeTab==='stats')c.innerHTML=renderStats();
  else if(activeTab==='mine')c.innerHTML=renderMine();
  bindTabEvents();
  afterRender();
}

function switchTab(tab){
  activeTab=tab;
  renderContent();
  const items=document.querySelectorAll('.tab-item');
  items.forEach((el,i)=>{
    const tabs=['home','calendar','add','stats','mine'];
    el.classList.toggle('active',tabs[i]===tab);
  });
}

function bindTabEvents(){
  document.querySelectorAll('.tab-item').forEach(el=>{
    el.addEventListener('click',()=>{const t=el.dataset.tab;if(t==='add')editingBillId='';if(t!==activeTab)switchTab(t)});
  });
  const addTab=document.querySelector('.tab-item[data-tab="add"]');
  if(addTab){addTab.addEventListener('click',e=>{e.stopPropagation();editingBillId='';switchTab('add')})}
}

function afterRender(){
  if(activeTab==='home')bindHome();
  else if(activeTab==='calendar')bindCalendar();
  else if(activeTab==='add')bindAdd();
  else if(activeTab==='stats')bindStats();
  else if(activeTab==='mine')bindMine();
}

// ========== HOME SCREEN ==========
function renderHome(){
  const bills=loadBills(),budget=loadBudget();
  const now=new Date();const sd=selectedHomeDate;const [sy,sm,sdNum]=sd.split('-').map(Number);
  const {start,end}=monthRange(sy,sm);
  const mBills=bills.filter(b=>b.timestamp>=start&&b.timestamp<=end);
  const mInc=mBills.filter(b=>b.type==='income').reduce((s,b)=>s+b.amount,0);
  const mExp=mBills.filter(b=>b.type==='expense').reduce((s,b)=>s+b.amount,0);
  const mBal=mInc-mExp;
  const hasBudget=budget>0;
  const remaining=budget-mExp;
  const bpct=budget>0?Math.min((mExp/budget)*100,100):0;
  const over=mExp>budget&&budget>0;
  const lastDay=new Date(sy,sm,0).getDate();
  const daysLeft=lastDay-now.getDate();

  const todayBills=bills.filter(b=>b.date===sd).sort((a,b)=>b.timestamp-a.timestamp);

  const today=fmtDate(new Date());
  const showGoTodayHome=sd!==today;

  let h=`<div class="header-section">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="date-block date-wrap" id="homeDateBlock"><span class="date-day"><span class="date-num date-num-month">${sm}</span>月<span class="date-num">${sdNum}</span>日</span><span class="date-weekday">${weekday(sd)}</span><input type="date" class="date-input-native" id="homeDatePicker" value="${sd}"></div>
      ${showGoTodayHome?`<button class="today-home-btn" id="goTodayHome">回到今天</button>`:''}
    </div>
    <button class="eye-btn" id="toggleAmount">${showAmount?'👁️':'👁️‍🗨️'}</button>
  </div>

  <div class="card">
    <div class="row"><span style="font-size:14px;color:var(--textSecondary)">${sm}月 收支概览</span><span style="font-size:14px;color:var(--textMuted)">本月剩余 <span style="color:var(--primary);font-weight:400">${Math.max(0,daysLeft)}</span> 天</span></div>
    <div class="summary-row" style="margin-top:4px">
      <div class="summary-item"><div class="summary-label">收入</div><div class="summary-amount" style="color:var(--success)">${showAmount?fmtMoney(mInc):'***'}</div></div>
      <div class="summary-divider"></div>
      <div class="summary-item"><div class="summary-label">支出</div><div class="summary-amount" style="color:var(--danger)">${showAmount?fmtMoney(mExp):'***'}</div></div>
      <div class="summary-divider"></div>
      <div class="summary-item"><div class="summary-label">结余</div><div class="summary-amount" style="color:${mBal>=0?'var(--success)':'var(--danger)'}">${showAmount?fmtMoney(mBal):'***'}</div></div>
    </div>
  </div>`;

  if(hasBudget){
    h+=`<div class="card">
      <div class="row" style="margin-bottom:8px"><span style="font-size:14px;color:var(--textSecondary)">月度预算</span><span style="font-size:14px;color:${over?'var(--danger)':'var(--textSecondary)'}">${over?'已超支':`剩余 ¥${fmtMoney(Math.abs(remaining))}`}</span></div>
      <div class="bar-bg"><div class="bar-fill${over?' bar-over':''}" style="width:${bpct}%"></div></div>
      <div class="row" style="margin-top:6px"><span style="font-size:11px;color:var(--textMuted)">已花 ¥${fmtMoney(mExp)}</span><span style="font-size:11px;color:var(--textMuted)">预算 ¥${showAmount?budget:'***'}</span></div>
    </div>`;
  }

  h+=`<div class="card" style="padding:20px 18px">
    <div class="action-grid">
      <div class="action-item" data-nav="calendar"><div class="action-icon bg1">📋</div><div class="action-label">账单</div></div>
      <div class="action-item" data-nav="calendar"><div class="action-icon bg2">📅</div><div class="action-label">日历</div></div>
      <div class="action-item" data-nav="stats"><div class="action-icon bg3">📊</div><div class="action-label">统计</div></div>
      <div class="action-item" data-nav="add"><div class="action-icon bg4">✏️</div><div class="action-label">记账</div></div>
    </div>
  </div>

  <div style="margin-top:6px">
    <div class="row" style="padding:0 8px 6px"><span style="font-size:18px;font-weight:400">今日流水</span><span style="font-size:14px;color:var(--textSecondary)">共 ${todayBills.length} 笔</span></div>`;

  if(todayBills.length===0){
    h+=`<div class="empty-state"><div style="font-size:48px;margin-bottom:8px">🍟</div><div style="color:var(--textSecondary)">今天还没有记账哦~</div><div style="color:var(--textMuted);font-size:13px;margin-top:6px">点一下底部的 + 开始记录吧</div></div>`;
  }else{
    todayBills.forEach(b=>{
      const cat=getCat(b.categoryId);
      h+=`<div class="bill-item" data-edit="${escapeHtml(b.id)}">
        <div class="bill-row">
          <div class="bill-icon-name"><span class="bill-icon">${cat.icon}</span><div><div class="bill-cat" style="${cat.name.length===2?'letter-spacing:.5em':''}">${cat.name}</div>${b.note?`<div class="bill-note">${escapeHtml(b.note)}</div>`:''}</div></div>
          <div class="bill-amount" style="color:${b.type==='income'?'var(--success)':'var(--danger)'}">${b.type==='income'?'+':'-'}${showAmount?fmtMoney(b.amount):'***'}</div>
        </div>
      </div>`;
    });
  }
  h+=`</div><div style="height:24px"></div>`;
  return h;

// ========== CALENDAR SCREEN ==========
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth()+1,calSelected=fmtDate(new Date());

function renderCalendar(){
  const today=fmtDate(new Date());
  const firstDay=new Date(calYear,calMonth-1,1).getDay();
  const dim=new Date(calYear,calMonth,0).getDate();
  const offset=firstDay===0?6:firstDay-1;

  const bills=loadBills();
  const dateMap={};bills.forEach(b=>{dateMap[b.date]=(dateMap[b.date]||0)+1});
  const {start,end}=monthRange(calYear,calMonth);
  const mBills=bills.filter(b=>b.timestamp>=start&&b.timestamp<=end);
  const mInc=mBills.filter(b=>b.type==='income').reduce((s,b)=>s+b.amount,0);
  const mExp=mBills.filter(b=>b.type==='expense').reduce((s,b)=>s+b.amount,0);

  const sBills=bills.filter(b=>b.date===calSelected).sort((a,b)=>b.timestamp-a.timestamp);

  let h=`<div class="month-header">
    <span class="month-arrow" id="calPrev">‹</span>
    <span class="month-title date-wrap" id="calMonthTitle"><span class="date-year">${calYear}</span>年 <span class="date-num">${calMonth}</span>月<input type="month" class="date-input-native" id="calMonthPicker" value="${calYear}-${String(calMonth).padStart(2,'0')}"></span>
    <button class="today-home-btn" id="goToday">回到今天</button>
    <span class="month-arrow" id="calNext">›</span>
  </div>`;

  h+=`<div class="cal-card">
    <div class="weekday-row">${['一','二','三','四','五','六','日'].map(d=>`<div class="weekday-text">${d}</div>`).join('')}</div>
    <div class="day-grid">`;
  for(let i=0;i<offset;i++)h+=`<div class="day-cell"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sel=ds===calSelected;const isT=ds===today;const hasB=dateMap[ds];
    h+=`<div class="day-cell${sel?' selected':''}${isT&&!sel?' today':''}" data-date="${ds}">${d}${hasB?`<div class="day-dot"></div>`:''}</div>`;
  }
  h+=`</div></div>`;

  h+=`<div class="cal-summary"><span class="cal-summary-left">收入 ¥${fmtMoney(mInc)}</span><span class="cal-summary-right">支出 ¥${fmtMoney(mExp)}</span></div>`;

  h+=`<div style="margin-top:12px" id="calBillListWrapper">
    <div class="section-header"><span class="section-title date-wrap" id="calDateLabel">${(()=>{const dl=dateLabel(calSelected);if(dl==='今天'||dl==='昨天')return dl;const m=calSelected.substring(5,7).replace(/^0/,''),d=calSelected.substring(8).replace(/^0/,'');return `<span class="date-num">${m}</span>月<span class="date-num">${d}</span>日`;})()}<input type="date" class="date-input-native" id="calDatePicker" value="${calSelected}"></span><span id="calBillCount" style="font-size:14px;color:var(--textSecondary)">共 ${sBills.length} 笔</span></div>
    <div id="calBillList">`;
  if(sBills.length===0){
    h+=`<div class="empty-state"><div style="font-size:48px;margin-bottom:8px">🍟</div><div style="color:var(--textSecondary)">当天没有记账记录</div></div>`;
  }else{
    sBills.forEach(b=>{
      const cat=getCat(b.categoryId);
      h+=`<div class="bill-item" data-edit="${escapeHtml(b.id)}">
        <div class="bill-row">
          <div class="bill-icon-name"><span class="bill-icon">${cat.icon}</span><div><div class="bill-cat" style="${cat.name.length===2?'letter-spacing:.5em':''}">${cat.name}</div>${b.note?`<div class="bill-note">${escapeHtml(b.note)}</div>`:''}</div></div>
          <div class="bill-amount" style="color:${b.type==='income'?'var(--success)':'var(--danger)'}">${b.type==='income'?'+':'-'}${fmtMoney(b.amount)}</div>
        </div>
      </div>`;
    });
  }
  h+=`</div></div><div style="height:20px"></div>`;
  return h;
}

function bindCalendar(){
  document.getElementById('calPrev').addEventListener('click',()=>{
    calMonth--;if(calMonth<1){calMonth=12;calYear--}renderContent();
  });
  document.getElementById('calNext').addEventListener('click',()=>{
    calMonth++;if(calMonth>12){calMonth=1;calYear++}renderContent();
  });
  document.getElementById('calMonthTitle').addEventListener('click',function(e){if(e.target.tagName!=='INPUT')document.getElementById('calMonthPicker').click()});

function updateCalBillList(){
  const bills=loadBills();
  const sBills=bills.filter(b=>b.date===calSelected).sort((a,b)=>b.timestamp-a.timestamp);
  const labelEl=document.getElementById('calDateLabel');
  if(labelEl){
    const dl=dateLabel(calSelected);
    const inputEl=labelEl.querySelector('input');
    // Preserve DOM structure: remove text/spans before input, then rebuild
    while(labelEl.firstChild){
      if(labelEl.firstChild===inputEl) break;
      labelEl.removeChild(labelEl.firstChild);
    }
    if(dl==='今天'||dl==='昨天'){
      labelEl.insertBefore(document.createTextNode(dl),inputEl);
    }else{
      const m=calSelected.substring(5,7).replace(/^0/,'');
      const d=calSelected.substring(8).replace(/^0/,'');
      const s1=document.createElement('span');s1.className='date-num';s1.textContent=m;
      const s2=document.createElement('span');s2.className='date-num';s2.textContent=d;
      labelEl.insertBefore(s1,inputEl);
      labelEl.insertBefore(document.createTextNode('月'),inputEl);
      labelEl.insertBefore(s2,inputEl);
      labelEl.insertBefore(document.createTextNode('日'),inputEl);
    }
    if(inputEl) inputEl.value=calSelected;
  }
  const cnt=document.getElementById('calBillCount');
  if(cnt)cnt.textContent=`共 ${sBills.length} 笔`;
  const listEl=document.getElementById('calBillList');
  if(!listEl)return;
  if(sBills.length===0){
    listEl.innerHTML=`<div class="empty-state"><div style="font-size:48px;margin-bottom:8px">🍟</div><div style="color:var(--textSecondary)">当天没有记账记录</div></div>`;
  }else{
    listEl.innerHTML=sBills.map(b=>{
      const cat=getCat(b.categoryId);
      return `<div class="bill-item" data-edit="${escapeHtml(b.id)}"><div class="bill-row"><div class="bill-icon-name"><span class="bill-icon">${cat.icon}</span><div><div class="bill-cat" style="${cat.name.length===2?'letter-spacing:.5em':''}">${cat.name}</div>${b.note?`<div class="bill-note">${escapeHtml(b.note)}</div>`:''}</div></div><div class="bill-amount" style="color:${b.type==='income'?'var(--success)':'var(--danger)'}">${b.type==='income'?'+':'-'}${fmtMoney(b.amount)}</div></div></div>`;
    }).join('');
    listEl.querySelectorAll('.bill-item').forEach(el=>el.addEventListener('click',()=>{showEditModal(el.dataset.edit)}));
  }
}

function bindAdd(){
  let selectedCat=document.querySelector('.cat-item.selected')?.dataset.cid||'';
  const si=document.getElementById('switchIncome'),se=document.getElementById('switchExpense');
  si.addEventListener('click',()=>{window._addType='income';selectedCat='';renderContent()});
  se.addEventListener('click',()=>{window._addType='expense';selectedCat='';renderContent()});

  document.querySelectorAll('.cat-item').forEach(el=>el.addEventListener('click',()=>{
    document.querySelectorAll('.cat-item').forEach(e=>e.classList.remove('selected'));
    el.classList.add('selected');selectedCat=el.dataset.cid;
    updateSaveBtn();
  }));

  const ai=document.getElementById('amountInput');
  ai.addEventListener('input',function(){
    let v=this.value.replace(/[^\d.]/g,'');
    const parts=v.split('.');if(parts.length>2)v=parts[0]+'.'+parts.slice(1).join('');
    if(parts.length===2&&parts[1].length>2)v=parts[0]+'.'+parts[1].slice(0,2);
    this.value=v;updateSaveBtn();
  });

  document.getElementById('saveBtn').addEventListener('click',()=>{
    const amount=parseFloat(ai.value);
    if(!amount||amount<=0){toast('请输入金额');return}
    if(!selectedCat){toast('请选择分类');return}
    const note=document.getElementById('noteInput').value.trim();
    const dateStr=document.getElementById('addDatePicker').value;
    const d=new Date(dateStr);d.setHours(new Date().getHours(),new Date().getMinutes(),new Date().getSeconds());
    const bills=loadBills();

    if(editingBillId){
      const idx=bills.findIndex(b=>b.id===editingBillId);
      if(idx===-1){toast('账单不存在');return}
      bills[idx]={...bills[idx],type:window._addType,categoryId:selectedCat,amount,note,date:dateStr,timestamp:d.getTime()};
      toast('修改成功');
    }else{
      bills.unshift({id:genId(),type:window._addType,categoryId:selectedCat,amount,note,date:dateStr,timestamp:d.getTime()});
      toast('记账成功');
    }
    saveBills(bills);editingBillId='';ai.value='';window._addType='expense';selectedCat='';
    document.getElementById('noteInput').value='';
    renderContent();
  });

  function updateSaveBtn(){
    const btn=document.getElementById('saveBtn');
    if(!editingBillId){
      const v=parseFloat(ai.value);btn.disabled=!(v>0&&selectedCat);
    }
  }
}

  document.getElementById('exportData').addEventListener('click',()=>{
    const bills=loadBills();
    if(!bills.length){toast('无数据可导出');return}
    showModal(`<div class="modal-title">选择导出格式</div>
      <div class="export-btns">
        <button class="export-btn" id="expCsv">📄 CSV 逗号分隔</button>
        <button class="export-btn" id="expTxt">📝 TXT 文本文件</button>
        <button class="export-btn" id="expXls">📊 XLS 工作表格</button>
      </div>
      <div class="modal-buttons"><button class="modal-btn cancel" onclick="closeModal()">取消</button></div>`);
    const csv='类型,分类,金额,日期,备注\n'+bills.map(b=>{
      const cat=getCat(b.categoryId);
      return `${b.type==='expense'?'支出':'收入'},${cat.name},${b.amount},${b.date},${b.note||''}`;
    }).join('\n');
    function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
    document.getElementById('expCsv').addEventListener('click',()=>{download(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),'记账数据.csv');closeModal();toast('CSV已下载')});
    document.getElementById('expTxt').addEventListener('click',()=>{download(new Blob([csv],{type:'text/plain;charset=utf-8'}),'记账数据.txt');closeModal();toast('TXT已下载')});
    document.getElementById('expXls').addEventListener('click',()=>{download(new Blob(['\uFEFF'+csv],{type:'application/vnd.ms-excel;charset=utf-8'}),'记账数据.xls');closeModal();toast('XLS已下载')});
  });

  document.getElementById('importData').addEventListener('click',()=>{
    showModal(`<div class="modal-title">导入数据</div>
      <div class="import-tabs">
        <button class="import-tab active" data-import-mode="paste" id="impPasteTab">粘贴 JSON</button>
        <button class="import-tab" data-import-mode="file" id="impFileTab">上传文件</button>
      </div>
      <div id="importPastePanel">
        <textarea class="modal-input" id="importText" rows="6" placeholder="粘贴 JSON 格式的账单数据..."></textarea>
        <div class="modal-buttons"><button class="modal-btn cancel" onclick="closeModal()">取消</button><button class="modal-btn confirm" id="confirmImport">确认导入</button></div>
      </div>
      <div id="importFilePanel" style="display:none">
        <input type="file" id="importFileInput" accept=".json,.csv,.txt,.xls" style="display:none">
        <div class="file-upload-area" id="fileDropZone">
          <div style="font-size:36px;margin-bottom:8px">📂</div>
          <div style="color:var(--textSecondary);margin-bottom:4px">点击选择或拖拽文件</div>
          <div style="font-size:12px;color:var(--textMuted)">支持 JSON / CSV / TXT / XLS</div>
        </div>
        <div class="modal-buttons"><button class="modal-btn cancel" onclick="closeModal()">取消</button></div>
      </div>`);
    let importMode='paste';
    document.getElementById('impPasteTab').addEventListener('click',function(){importMode='paste';this.classList.add('active');document.getElementById('impFileTab').classList.remove('active');document.getElementById('importPastePanel').style.display='';document.getElementById('importFilePanel').style.display='none'});
    document.getElementById('impFileTab').addEventListener('click',function(){importMode='file';this.classList.add('active');document.getElementById('impPasteTab').classList.remove('active');document.getElementById('importPastePanel').style.display='none';document.getElementById('importFilePanel').style.display=''});

    function parseAndImport(raw){
      let arr=[];
      try{
        if(raw.trim().startsWith('[')||raw.trim().startsWith('{')){
          arr=JSON.parse(raw);if(!Array.isArray(arr))throw new Error();
        }else{
          const lines=raw.trim().split('\n').filter(l=>l.trim());
          if(!lines.length){toast('无有效数据');return}
          const header=lines[0].toLowerCase();
          const idxType=header.includes('类型')?header.split(',').findIndex(c=>c.includes('类型')):0;
          const idxCat=header.includes('分类')?header.split(',').findIndex(c=>c.includes('分类')):1;
          const idxAmt=header.includes('金额')?header.split(',').findIndex(c=>c.includes('金额')):2;
          const idxDate=header.includes('日期')?header.split(',').findIndex(c=>c.includes('日期')):3;
          const idxNote=header.includes('备注')?header.split(',').findIndex(c=>c.includes('备注')):4;
          for(let i=1;i<lines.length;i++){
            const cols=lines[i].split(',');
            if(cols.length<3)continue;
            const typeName=(cols[idxType]||'').trim();
            const type=typeName==='收入'?'income':'expense';
            const catName=(cols[idxCat]||'').trim();
            const cat=ALL_CATS.find(c=>c.name===catName)||EXPENSE_CATS.find(c=>c.name===catName)||INCOME_CATS.find(c=>c.name===catName);
            arr.push({type,categoryId:cat?cat.id:'other',amount:parseFloat(cols[idxAmt])||0,date:(cols[idxDate]||'').trim(),note:(cols[idxNote]||'').trim()});
          }
        }
      }catch{toast('数据格式错误');return}
      const newBills=arr.map((item,idx)=>({id:item.id||genId(),type:item.type||'expense',categoryId:item.categoryId||'other',amount:parseFloat(item.amount)||0,note:item.note||'',date:item.date||'',timestamp:item.timestamp||Date.now()-idx*1000})).filter(b=>b.amount>0&&b.date);
      if(!newBills.length){toast('无有效数据');return}
      saveBills([...newBills,...loadBills()]);closeModal();renderContent();toast(`已导入 ${newBills.length} 条`);
    }

    document.getElementById('confirmImport').addEventListener('click',()=>{const t=document.getElementById('importText').value.trim();if(!t){toast('请粘贴数据');return}parseAndImport(t)});

    const fdz=document.getElementById('fileDropZone');
    fdz.addEventListener('click',()=>document.getElementById('importFileInput').click());
    fdz.addEventListener('dragover',e=>{e.preventDefault();fdz.style.borderColor='var(--primary)';fdz.style.background='var(--primaryBg)'});
    fdz.addEventListener('dragleave',()=>{fdz.style.borderColor='';fdz.style.background=''});
    fdz.addEventListener('drop',e=>{e.preventDefault();fdz.style.borderColor='';fdz.style.background='';const f=e.dataTransfer.files[0];if(f)readFile(f)});
    document.getElementById('importFileInput').addEventListener('change',function(){if(this.files[0])readFile(this.files[0])});

    function readFile(file){
      const reader=new FileReader();
      reader.onload=function(){parseAndImport(reader.result)};
      reader.readAsText(file,'UTF-8');
    }
  });

  document.getElementById('clearData').addEventListener('click',()=>{
    const bills=loadBills();
    const hasData=bills.length>0||loadBudget()>0||loadUsername()!=='喵喵生活';
    const csv='类型,分类,金额,日期,备注\n'+bills.map(b=>{const cat=getCat(b.categoryId);return `${b.type==='expense'?'支出':'收入'},${cat.name},${b.amount},${b.date},${b.note||''}`}).join('\n');
    const doClear=()=>{saveBills([]);saveBudget(0);saveUsername('喵喵生活');closeModal();renderContent();toast('数据已全部清除')};
    showModal(`<div class="modal-title">清除数据</div><div style="text-align:center;color:var(--textSecondary);margin-bottom:16px">将删除全部账单、预算和用户名称，此操作不可恢复。${hasData?'是否先导出现有数据？':''}</div>${hasData?`<div class="export-btns"><button class="export-btn" id="exportTxtClear">📝 导出 TXT 并清除</button><button class="export-btn" id="exportXlsClear">📊 导出 XLS 并清除</button></div>`:''}<div class="modal-buttons" style="flex-direction:column;gap:10px;margin-top:${hasData?'8px':'0'}"><button class="modal-btn danger-confirm" id="confirmClear">${hasData?'直接清除':'确认清除'}</button><button class="modal-btn cancel" onclick="closeModal()">取消</button></div>`);
    document.getElementById('confirmClear').addEventListener('click',doClear);
    const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)};
    const etcTxt=document.getElementById('exportTxtClear');
    if(etcTxt)etcTxt.addEventListener('click',()=>{dl(new Blob([csv],{type:'text/plain;charset=utf-8'}),'记账数据.txt');doClear()});
    const etcXls=document.getElementById('exportXlsClear');
    if(etcXls)etcXls.addEventListener('click',()=>{dl(new Blob(['\uFEFF'+csv],{type:'application/vnd.ms-excel;charset=utf-8'}),'记账数据.xls');doClear()});
  });

  document.querySelectorAll('.menu-item[data-nav]').forEach(el=>el.addEventListener('click',()=>{switchTab(el.dataset.nav)}));
}

// ========== TAB BAR INIT ==========
function renderTabBar(){
  const tabs=['home','calendar','add','stats','mine'];
  const labels=['首页','日历','','统计','我的'];
  const icons=['🏠','📅','＋','📊','🍟'];
  document.getElementById('tabBar').innerHTML=tabs.map((t,i)=>{
    const active=t===activeTab?' active':'';
    if(t==='add')return `<div class="tab-item special${active}" data-tab="${t}"><div class="tab-icon">＋</div></div>`;
    return `<div class="tab-item${active}" data-tab="${t}"><span class="tab-inner"><div class="tab-icon">${icons[i]}</div>${labels[i]}</span></div>`;
  }).join('');
}

// ========== INIT ==========
window._addType='expense';
renderTabBar();
renderContent();
switchTab('home');

// ========== PWA: 注册 Service Worker（兼容 GitHub Pages 子路径） ==========
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register(new URL('sw.js',document.baseURI).href).catch(function(){});
  });
}
</script>
